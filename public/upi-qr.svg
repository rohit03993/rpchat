<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <rect width="320" height="320" fill="#ffffff"/>
  <rect x="16" y="16" width="288" height="288" rx="12" fill="none" stroke="#111111" stroke-width="3"/>
  <text x="160" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#111111">Your UPI QR here</text>
  <text x="160" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555555">Replace public/upi-qr.svg</text>
  <text x="160" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555555">or set UPI_QR_URL in .env</text>
  <text x="160" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888">Also set UPI_ID=you@upi</text>
</svg>
